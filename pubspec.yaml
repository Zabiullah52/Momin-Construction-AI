name: momin_construction_ai
description: "Momin Construction AI - Construction Cost Estimation & BOQ Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1
  cloud_functions: ^5.1.4

  # Networking / AI
  http: ^1.2.2
  dio: ^5.7.0

  # PDF & Excel export
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  open_filex: ^4.5.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # In-app purchases / subscriptions
  in_app_purchase: ^3.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/rates/material_rates.json
    - assets/rates/labour_rates.json
    - assets/rates/city_multipliers.json
    - assets/rates/specialized_rates.json
